name: Release

# "v1.2.3" biçiminde bir etiket gönderildiğinde tek dosyalık exe derlenir ve GitHub Releases'e yüklenir:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Üçüncü taraf eylemler etiket yerine commit'e sabitlenir: etiket sonradan başka koda taşınamaz.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --project tests/EngelsizDPI.Tests/EngelsizDPI.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          # GitHubRepo: uygulamanın güncellemeleri hangi depodan alacağı (bu depo).
          dotnet publish src/EngelsizDPI/EngelsizDPI.csproj -c Release -r win-x64 -o publish -p:Version=$version -p:GitHubRepo=$env:GITHUB_REPOSITORY
          # Uygulama indirdiği güncellemeyi bu özetle doğrular.
          $hash = (Get-FileHash publish/EngelsizDPI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EngelsizDPI.exe" | Out-File -Encoding ascii -NoNewline publish/EngelsizDPI.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EngelsizDPI-win-x64
          path: |
            publish/EngelsizDPI.exe
            publish/EngelsizDPI.exe.sha256

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            publish/EngelsizDPI.exe
            publish/EngelsizDPI.exe.sha256
          generate_release_notes: true
